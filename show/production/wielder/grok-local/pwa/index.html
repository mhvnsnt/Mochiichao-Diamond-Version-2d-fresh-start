<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0f14">
<title>grok-local</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, sans-serif;
         background: #0b0f14; color: #e6edf3; }
  header { padding: 10px 14px; border-bottom: 1px solid #223;
           display: flex; gap: 10px; align-items: center;
           flex-wrap: wrap; }
  header b { font-size: 17px; }
  header .seat { color: #8b98a5; font-size: 12px; }
  button { background: #1f6feb; color: #fff; border: 0;
           border-radius: 8px; padding: 9px 14px; font-size: 15px; }
  button.secondary { background: #21262d; }
  button:disabled { opacity: .5; }
  #settings { padding: 12px 14px; border-bottom: 1px solid #223;
              display: none; }
  #settings.open { display: block; }
  #settings label { display: block; font-size: 13px; color: #8b98a5;
                    margin: 10px 0 3px; }
  #settings input, #settings select { width: 100%; box-sizing: border-box;
    background: #0d1117; color: #e6edf3; border: 1px solid #30363d;
    border-radius: 6px; padding: 8px; font-size: 14px; }
  #settings .note { font-size: 12px; color: #8b98a5; margin-top: 6px; }
  #log { padding: 12px 14px 90px; max-width: 760px; margin: 0 auto; }
  .msg { margin: 0 0 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg .who { font-size: 12px; color: #8b98a5; margin-bottom: 2px; }
  .msg.user .body { color: #a5d6ff; }
  .msg.error .body { color: #ff7b72; }
  #banner { display: none; padding: 8px 14px; font-size: 13px;
            background: #3d2e00; color: #f0c674; }
  #banner.show { display: block; }
  #composer { position: fixed; left: 0; right: 0; bottom: 0;
    background: #0b0f14; border-top: 1px solid #223; padding: 10px;
    display: flex; gap: 8px; max-width: 760px; margin: 0 auto; }
  #input { flex: 1; background: #0d1117; color: #e6edf3;
    border: 1px solid #30363d; border-radius: 8px; padding: 10px;
    font-size: 16px; resize: none; }
</style>
</head>
<body>
<header>
  <b>grok-local</b>
  <span class="seat" id="seatLabel">no seat yet</span>
  <span style="flex:1"></span>
  <button class="secondary" id="settingsBtn">Settings</button>
</header>
<div id="banner"></div>

<section id="settings">
  <label>Mode</label>
  <select id="mode">
    <option value="phone">Phone seat — runs on this phone's own chip (owned, offline)</option>
    <option value="seat">Server seat — a vLLM endpoint (free test / serverless / rented)</option>
  </select>
  <div class="note" id="modeNote"></div>

  <div id="phoneFields">
    <label>On-phone model</label>
    <select id="modeBModel">
      <option value="Qwen3-1.7B-q4f16_1-MLC">Qwen3 1.7B — the phone seat (both phones)</option>
      <option value="Qwen3-4B-q4f16_1-MLC">Qwen3 4B — bigger brain (8 GB phone only)</option>
    </select>
    <div class="note" id="modeBNote"></div>
  </div>

  <div id="seatFields">
    <label>Rendezvous dataset (optional — the app finds the current
      seat address here; set up once per DEPLOY-RUNBOOK.md)</label>
    <input id="rvDataset" placeholder="your-hf-name/grok-local-rendezvous">
    <label>Rendezvous read token (HF token with read access to that
      private dataset — stored only on this phone)</label>
    <input id="rvToken" type="password" autocomplete="off">
    <label>Endpoint base URL (…/v1) — filled by the rendezvous, or
      paste it by hand</label>
    <input id="endpoint" placeholder="https://something.trycloudflare.com/v1">
    <label>Endpoint API key (the lock on the seat's door — anyone
      holding it can use the seat)</label>
    <input id="apikey" type="password" autocomplete="off">
    <label>Model name</label>
    <input id="model" value="grok-local">
  </div>
  <div class="note">Settings live in this browser only
    (localStorage). Nothing here is sent anywhere except the
    endpoint and, if set, huggingface.co for the rendezvous.</div>
</section>

<main id="log"></main>

<form id="composer">
  <textarea id="input" rows="1" placeholder="Message grok-local…"></textarea>
  <button id="send" type="submit">Send</button>
</form>

<script src="api.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
</script>
</body>
</html>
