# grok-local seat via Docker Compose — the container twin of
# launch.sh. The flags below MUST stay in step with launch.sh
# (same variant defaults live there; MODEL_VARIANT on the host
# picks the model dir + limits via the env block).
#
#   cp serve.env.example serve.env   # set GROK_LOCAL_API_KEY
#   python3 pull_model.py --variant primary --out ./models/primary
#   docker compose up -d
#
# Free-seat / T4 variant: set MODEL_VARIANT=free-seat and add
# --dtype float16 --enforce-eager by switching command args to the
# free-seat line noted in launch.sh (compose cannot branch; the two
# profiles below cover the two card classes).
services:
  grok-local:
    build: .
    image: grok-local:vllm-0.8.5
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    env_file:
      - serve.env
    volumes:
      - ./models:/models:ro
    ports:
      - "8000:8000"
    command: >
      /models/${MODEL_VARIANT:-primary}
      --served-model-name grok-local
      --host 0.0.0.0 --port 8000
      --max-model-len ${MAX_MODEL_LEN:-32768}
      --gpu-memory-utilization 0.95
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --allowed-origins "*" --allowed-methods "*" --allowed-headers "*"
      ${GROK_LOCAL_API_KEY:+--api-key ${GROK_LOCAL_API_KEY}}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 10
