# ai-toolkit LoRA config — Wan2.2 TI2V-5B character LoRA for wispkin on a 24GB card.
# Adapted from ai-toolkit's OWN shipped example config/examples/train_lora_wan22_14b_24gb.yaml
# (@ b69b9831). Every change from that example is commented inline:
#   CHANGE 1: model.name_or_path + arch -> the TI2V-5B model and its dedicated arch class
#             (extensions_built_in/diffusion_models/wan22/wan22_5b_model.py: arch = "wan22_5b";
#             README lists Wan-AI/Wan2.2-TI2V-5B-Diffusers as a supported model).
#   CHANGE 2: MoE-only keys REMOVED (train.switch_boundary_every, model_kwargs
#             train_high_noise/train_low_noise) — TI2V-5B is a SINGLE transformer
#             (wan22_5b_model.py has no expert switching); those keys belong to the
#             dual-expert A14B only.
#   CHANGE 3: model.qtype (14B accuracy-recovery adapter file) REMOVED — no 5B ARA file
#             was verified at source; inventing a path would break the run. quantize
#             stays true per the 24GB example; first run verifies its behaviour.
#   CHANGE 4: dataset num_frames 1 (stills training, per the example's own header:
#             "training Wan2.2 on images... will work for video as well"), sample
#             num_frames 49 at 832x480 (the TI2V-5B scene size family).
# Kept from the example, unchanged: network linear/alpha 32, lr 1e-4, steps guidance
# ("500 - 4000 is a good range"), adamw8bit, gradient_checkpointing, cache_text_embeddings
# ("required for 24GB cards"), dtype bf16, save/sample cadence, guidance_scale 3.5.
---
job: extension
config:
  name: "wispkin_ti2v5b_lora_v1"
  process:
    - type: 'sd_trainer'
      training_folder: "output"
      device: cuda:0
      trigger_word: "wispkin_mochii"
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
      save:
        dtype: float16
        save_every: 250
        max_step_saves_to_keep: 4
      datasets:
        - folder_path: "datasets/wispkin"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          num_frames: 1
          resolution: [ 512, 768, 1024 ]
      train:
        batch_size: 1
        steps: 2000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        timestep_type: 'linear'
        optimizer: "adamw8bit"
        lr: 1e-4
        optimizer_params:
          weight_decay: 1e-4
        dtype: bf16
        cache_text_embeddings: true
      model:
        name_or_path: "Wan-AI/Wan2.2-TI2V-5B-Diffusers"
        arch: 'wan22_5b'
        quantize: true
        quantize_te: true
        qtype_te: "qfloat8"
        low_vram: true
      sample:
        sampler: "flowmatch"
        sample_every: 250
        sample_start_step: 0
        width: 832
        height: 480
        num_frames: 49
        fps: 16
        prompts:
          - "[trigger], Wispkin, a small ghost creature with a round black shadowy body, a cracked white skull mask, a black flame tip on top of its head, and a wispy black smoke tail, standing in a garden, flat 2D cartoon illustration, clean black outlines, cel shading"
          - "[trigger], Wispkin, a small ghost creature with a round black shadowy body, a cracked white skull mask, a black flame tip on top of its head, and a wispy black smoke tail, front view, full body, on a plain white background, flat 2D cartoon illustration"
        neg: "3d render, cgi, photorealistic, blurry, distorted, deformed, morphing, changing design, extra characters, extra limbs, text, watermark"
        seed: 42
        walk_seed: true
        guidance_scale: 3.5
        sample_steps: 25
meta:
  name: "[name]"
  version: '1.0'
