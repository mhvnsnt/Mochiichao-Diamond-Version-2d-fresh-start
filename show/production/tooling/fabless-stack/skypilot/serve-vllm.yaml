# SkyPilot task: serve a model with vLLM on whatever seat is available.
# Fabless Stack link 3 (the fab) + link 5 (PagedAttention serving payload).
#
# Seat choice is a VARIABLE, per the owner's operating model:
#   - First choice: a free/borrowed GPU session where SkyPilot's model fits
#     (it provisions real cloud VMs; it does NOT drive Kaggle notebooks —
#     Kaggle seats are run by the grok-local rotation, cross-referenced in
#     show/production/wielder/grok-local/).
#   - Later: a rented seat, when the owner says rent.
# SkyPilot itself: Apache-2.0 (skypilot-org/skypilot). vLLM: Apache-2.0.
#
# Launch:  sky launch serve-vllm.yaml -c wielder-serve
# The endpoint is then published to the rendezvous by the tunnel layer
# (../tunnel/) — clients never hardcode the seat address.

name: wielder-serve

resources:
  # Any single GPU with >=16GB. SkyPilot picks the cheapest available
  # across the clouds the operator has enabled (RunPod / Vast.ai / etc.).
  accelerators: {T4: 1, L4: 1, A10: 1, RTX4090: 1}
  use_spot: true            # serving can restart; state lives in the rendezvous
  ports:
    - 8000                  # vLLM OpenAI-compatible API

envs:
  # Model is a variable too: small on free seats, larger on rented ones.
  MODEL_ID: Qwen/Qwen2.5-7B-Instruct-AWQ
  MAX_MODEL_LEN: "8192"

setup: |
  pip install --quiet "vllm" "huggingface_hub"
  # Weights are pulled on the seat (staging law: no multi-GB binaries in git).

run: |
  vllm serve "$MODEL_ID" \
    --host 0.0.0.0 --port 8000 \
    --max-model-len "$MAX_MODEL_LEN" \
    --gpu-memory-utilization 0.92
  # Multi-GPU seats: add --tensor-parallel-size N (collectives: NCCL on
  # NVIDIA, RCCL on ROCm — see ../TEARDOWN-interconnect.md).
