# cloudflared named-tunnel template (Fabless Stack, phone line / rendezvous).
# Client licence: Apache-2.0. The tunnel NETWORK is free proprietary —
# named tunnels are free with a Cloudflare account + a domain on
# Cloudflare DNS. Quick Tunnels (trycloudflare) are dev-only per
# Cloudflare's own docs: no SLA, ~200 concurrent in-flight requests,
# no SSE — fine for a smoke test, not for a seat people rely on.
#
# Setup (once, on the seat):
#   cloudflared tunnel login
#   cloudflared tunnel create wielder-seat
#   cloudflared tunnel route dns wielder-seat seat.example.com
# Then run:  cloudflared tunnel --config config.yml run wielder-seat
# The rendezvous record is updated with https://seat.example.com
# whenever the seat rotates (see ../../serving/README.md).

tunnel: wielder-seat
credentials-file: /path/to/seat-credentials.json   # generated by `tunnel create`; never commit

ingress:
  - hostname: seat.example.com        # replace with the real hostname
    service: http://localhost:8000    # the seat's local server (vLLM :8000 or llama-server :8080)
  - service: http_status:404          # catch-all (required by cloudflared)
