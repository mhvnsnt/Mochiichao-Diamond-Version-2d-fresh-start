name: ci-budgets
# Bundle + unit-test budget gate for Mochiichao PRs.
# Runs on every PR: typecheck, existing src/lib tests, the new tests/*.test.ts
# scaffolding, a production build, and the JS bundle budget check
# (tests/check-bundle-budget.mjs, budgets in tests/bundle-budgets.json).
# Deliberately does NOT run Playwright or Lighthouse here: those gates need
# a live browser / live Pages run, which goes to the parent playtest session
# (see docs/ci-budgets-2026-10-27.md). This workflow must stay green
# without a browser.
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  budgets:
    runs-on: ubuntu-latest
    # tsc --noEmit OOMs at Node's default ~2 GB heap on this repo
    # (tsconfig includes src + tests + tools with resolveJsonModule;
    # PRs #407/#408/#409 all died with "JavaScript heap out of memory",
    # exit 134, 0 TS errors). 4 GB still OOM'd on PR #410's own run
    # (job 131600191842), so give every Node step 6 GB of heap.
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install (lockfile)
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Existing unit tests (src/lib)
        run: npm run test
      # Explicit file list: a quoted glob does NOT match under Vitest (its
      # CLI filters are substrings), and `vitest run tests` would also pick
      # up the Playwright e2e spec, which must never run under Vitest.
      - name: New unit-test scaffolding (tests/*.test.ts only, not e2e specs)
        run: npx vitest run tests/ci-budgets.test.ts tests/type-chart.test.ts tests/opponent-direction.test.ts tests/tiled-map-gates.test.ts tests/dialogue-structure.test.ts tests/dialogue-exit-flag.test.ts tests/wiring.test.ts
      - name: Tiled map validation (validate:maps)
        run: npm run validate:maps
      - name: Dialogue validation (validate:dialogue)
        run: npm run validate:dialogue
      - name: Production build
        run: npx vite build --base=./
      - name: Bundle budget check (fails when budgets are exceeded)
        run: node tests/check-bundle-budget.mjs dist
